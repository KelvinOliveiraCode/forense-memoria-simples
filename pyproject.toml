[project]
name = "forense-memoria-simples"
version = "0.1.0"
description = "Forense volátil: extração de strings imprimíveis e scan de IOCs em dumps de memória simulados."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
forense-memoria = "forense_memoria_simples.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
